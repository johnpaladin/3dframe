<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#05060a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>3D 視窗相框</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs"
    }
  }
  </script>
</head>
<body>
  <canvas id="c"></canvas>

  <!-- 相機畫面(不顯示,只給追蹤用) -->
  <video id="video" playsinline muted autoplay></video>
  <canvas id="preview" hidden></canvas>

  <div id="hud"><span id="dot"></span><span id="status">尚未開始</span></div>

  <nav id="scenes">
    <button data-scene="room" class="on">房間</button>
    <button data-scene="mountain">山景</button>
    <button data-scene="photo">照片</button>
  </nav>

  <button id="gear" aria-label="設定">⚙︎</button>

  <section id="panel" hidden>
    <h2>設定</h2>
    <label>螢幕短邊寬度 <output id="o-screen"></output> cm
      <input id="s-screen" type="range" min="4" max="40" step="0.1">
    </label>
    <label>相機視角 <output id="o-fov"></output>°
      <input id="s-fov" type="range" min="40" max="110" step="1">
    </label>
    <button id="calib" class="wide">我現在離螢幕 30 cm → 校正距離</button>
    <label>效果強度 <output id="o-gain"></output>×
      <input id="s-gain" type="range" min="0.5" max="2.5" step="0.05">
    </label>
    <label>景深 <output id="o-depth"></output> cm
      <input id="s-depth" type="range" min="8" max="60" step="1">
    </label>
    <label>平滑度 <output id="o-smooth"></output>
      <input id="s-smooth" type="range" min="0" max="1" step="0.05">
    </label>
    <label class="row"><input id="s-preview" type="checkbox"> 顯示相機預覽</label>
    <div class="btns">
      <button id="upload">上傳照片</button>
      <button id="fullscreen">全螢幕</button>
      <button id="reset">重設</button>
    </div>
    <p class="hint">提示:效果是「單眼」透視,閉上一隻眼睛看會更立體。</p>
  </section>

  <div id="intro">
    <div class="card">
      <h1>3D 視窗相框</h1>
      <p>用前鏡頭追蹤你的眼睛位置,把螢幕變成一扇通往裡面空間的窗戶。左右上下移動頭部,或把手機前後拉近拉遠看看。</p>
      <button id="start-face" class="primary">開始(眼部追蹤)</button>
      <button id="start-manual">不用相機(陀螺儀/滑鼠)</button>
      <p class="small">影像只在你的裝置上處理,不會上傳。需在 HTTPS 下開啟。</p>
    </div>
  </div>

  <input id="file" type="file" accept="image/*" hidden>

  <script type="module" src="main.js"></script>
</body>
</html>
